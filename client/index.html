<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Mama-Hafen | Gelassen durch die Autonomiephase</title>
    <meta name="description" content="Lerne, die Autonomiephase deines Kindes zu verstehen, Wutanfälle liebevoll zu begleiten und endlich wieder Harmonie in euren Familienalltag zu bringen." />
    <!-- Browser-Theme-Farbe: passt Adressleiste und UI an das Seitendesign an -->
    <meta name="theme-color" content="#f5f0e8" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f0e8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1a3a3a" />
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <!-- Apple / Safari PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mama-Hafen" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <!-- Tracking-Skripte werden erst nach Cookie-Zustimmung geladen (CookieBanner.tsx) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>
</html>
